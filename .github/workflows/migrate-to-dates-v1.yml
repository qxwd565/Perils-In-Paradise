name: Normalize HSdeck dated cards
on:
  push:
    paths:
      - '.github/workflows/migrate-to-dates-v1.yml'
      - 'tools/dated-migration-dates.json'
      - 'data/**'
      - 'cards.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dated-cards-perils-in-paradise
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch immutable shared converter
        run: |
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/qxwd565/legacy/733f4fb359732b0a3599029387082e968d77010a/tools/convert-to-dates-v1.py' -o /tmp/convert-to-dates-v1.py
      - name: Verify and convert date-first card sources
        run: |
          python /tmp/convert-to-dates-v1.py --root . --strict
          python /tmp/convert-to-dates-v1.py --root . --strict --check
          git diff --check
      - name: Verify Perils first playable days and correct Marin's treasures
        run: |
          python - <<'PYRELEASE'
          import json
          from pathlib import Path
          catalog=Path("cards.json")
          d=json.loads(catalog.read_text(encoding="utf-8"))
          if len(d.get("cards",[]))!=306: raise SystemExit("Card count changed")
          early={"VAC_702","VAC_702t","VAC_702t2","VAC_702t3","VAC_702t4"}
          for c in d["cards"]:
              p=Path("data")/(c["id"]+".json")
              raw=p.read_text(encoding="utf-8")
              records=json.loads(raw)
              days=sorted(k for k in records if len(k)==10 and k[4]=="-" and k[7]=="-")
              if not days: raise SystemExit("No dated history "+c["id"])
              first=records[days[0]]
              if first.get("id")!=c["id"] or first.get("dbfId")!=c["dbfId"]: raise SystemExit("Identity changed "+c["id"])
              expected=("2024-06-18" if c["id"] in early else
                        "2024-09-11" if c["id"].startswith("WORK_") else
                        "2024-07-24" if c["id"].startswith("VAC_") else None)
              if c["id"] in early and c["id"]!="VAC_702" and days[0]=="2024-07-24":
                  if "2024-06-18" in records: raise SystemExit("Duplicate first date "+c["id"])
                  fixed=raw.replace('"2024-07-24":','"2024-06-18":',1)
                  if fixed==raw: raise SystemExit("Cannot correct treasure date "+c["id"])
                  p.write_text(fixed,encoding="utf-8")
                  days[0]="2024-06-18"
              if days[0]!=expected: raise SystemExit("Unexpected first-use day "+c["id"]+" "+days[0]+" expected "+str(expected))
              if c.get("releasedAt") not in (None,days[0]): raise SystemExit("Catalog conflict "+c["id"])
              c["releasedAt"]=days[0]
              c["releaseStatus"]="verified"
          catalog.write_text(json.dumps(d,ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf-8")
          PYRELEASE
      - name: Commit dated card JSON only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- data/ cards.json
          if ! git diff --cached --quiet; then
            git commit -m 'Convert Perils-In-Paradise card history to dates-v1 [skip ci]'
            git push origin HEAD:main
          fi
